# Netlify settings: only the "public" folder goes online.
[build]
  publish = "public"

# Nice short address for the admin page: /admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Basic security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The admin page should never be stored in shared caches
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
